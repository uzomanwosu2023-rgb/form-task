    <h1>Book Donation Form</h1>

<form>
    <fieldset>
        <legend>Donor Details</legend>
            <label>Name</label>
            <input type="text" placeholder="Input name here"><br><br>
            <label>Donor ID</label>
            <input type="password" placeholder="input password here"><br><br>
            <label>Donation Date</label>
            <input type="date">
        </legend>
    </fieldset>
    <br>
    

    <fieldset>
        <legend>Book Details</legend>
        <select id="book detail">
            <option value="">--Book Category--</option>
            <option value="fiction">Fiction</option>
            <option value="science">Science</option>
            <option value="history">History</option>
            <option value="education">Education</option>
        </select>
        <br><br>

        <label>Book Condition</label><br>
        <input type="radio" name="condition" value="new">New<br>
        <input type="radio" name="condition" value="good">Good<br>
        <input type="radio" name="condition" value="used">Used<br>
        <br>
        <label>For notes on your book!</label><br>
        <textarea id="notes" cols="35" rows="5" placeholder="Type your book title and notes here!"></textarea>
    </fieldset>
    <br>

    <fieldset>
        <legend>Drop-Off Day</legend>
        <input type="checkbox" value="mon">Monday<br>
        <input type="checkbox" value="wed">Wednesday<br>
        <input type="checkbox" value="fri">Friday<br>
    </fieldset>
    <br>

    <label>Submit book here!</label>
    <input type="submit" value="Submit">
